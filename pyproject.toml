[project]
name = "epistemic-trust-inference"
version = "1.0.0"
description = "Code and results for 'Epistemic Trust as Inference About Other Minds' (Johansson): memo models, fits, model comparison and figures."
readme = "README.md"
license = "MIT"
authors = [{ name = "Robert Johansson" }]
requires-python = ">=3.14,<3.15"
# Exact versions that produced every number in the paper.
dependencies = [
    "memo-lang==1.3.3",
    "jax==0.12.1",
    "jaxlib==0.12.1",
    "numpy==2.5.5",
    "scipy==1.18.1",
]

[tool.uv]
package = false
